<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長照費用試算表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    input[type=range] {
      -webkit-appearance: none; 
      background: transparent; 
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
    }
    input[type=range]:focus {
      outline: none; 
    }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const STORAGE_KEY = 'ltc-fees-config';

    const IconWrapper = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Calculator = (props) => <IconWrapper {...props}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconWrapper>;
    const User = (props) => <IconWrapper {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>;
    const ClipboardList = (props) => <IconWrapper {...props}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></IconWrapper>;
    const Trash2 = (props) => <IconWrapper {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconWrapper>;
    const Plus = (props) => <IconWrapper {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconWrapper>;
    const Minus = (props) => <IconWrapper {...props}><path d="M5 12h14"/></IconWrapper>;
    const Coins = (props) => <IconWrapper {...props}><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></IconWrapper>;
    const AlertCircle = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconWrapper>;
    const Home = (props) => <IconWrapper {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconWrapper>;
    const Sun = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconWrapper>;
    const Package = (props) => <IconWrapper {...props}><path d="m16.5 9.4-9-5.19"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" x2="12" y1="22.08" y2="12"/></IconWrapper>;

    const DEFAULT_FEES = {
      version: '2025',
      updatedAt: '2025-01-01',
      dayCareRates: {
        2: { half: 340, full: 675 },
        3: { half: 420, full: 840 },
        4: { half: 460, full: 920 },
        5: { half: 525, full: 1045 },
        6: { half: 565, full: 1130 },
        7: { half: 605, full: 1210 },
        8: { half: 645, full: 1285 },
      },
      monthlyLimits: {
        2: 10020, 3: 15460, 4: 18580, 5: 24100,
        6: 28070, 7: 32090, 8: 36180,
      },
      respiteLimits: {
        2: 32340, 3: 32340, 4: 32340, 5: 32340, 6: 32340,
        7: 48510, 8: 48510,
      },
      serviceItems: [
        { code: 'BA01', name: '基本身體清潔', price: 260 },
        { code: 'BA02', name: '基本日常照顧(30分鐘)', price: 195 },
        { code: 'BA03', name: '測量生命徵象', price: 35 },
        { code: 'BA04', name: '協助進食或管灌餵食', price: 130 },
        { code: 'BA05', name: '餐食照顧', price: 310 },
        { code: 'BA07', name: '協助沐浴及洗頭', price: 325 },
        { code: 'BA08', name: '協助沐浴及洗頭', price: 500 },
        { code: 'BA10', name: '翻身拍背', price: 155 },
        { code: 'BA11', name: '肢體關節活動', price: 195 },
        { code: 'BA12', name: '協助上下樓梯', price: 130 },
        { code: 'BA13', name: '陪同外出(30分鐘)', price: 195 },
        { code: 'BA14', name: '陪同就醫(1.5小時)', price: 685 },
        { code: 'BA15-1', name: '家務協助(30分鐘)', price: 195 },
        { code: 'BA15-2', name: '家務協助(共用)', price: 195, fixedCopay: { general: 112, midLow: 101, low: 97 } },
        { code: 'BA16-1', name: '代購/代領/代送', price: 130 },
        { code: 'BA16-2', name: '代購/代領/代送(共用)', price: 130, fixedCopay: { general: 75, midLow: 68, low: 65 } },
        { code: 'BA17a', name: '人工氣道管內分泌物抽吸', price: 75 },
        { code: 'BA17b', name: '口腔內分泌物抽吸', price: 65 },
        { code: 'BA17c', name: '尿管及鼻胃管之清潔與固定', price: 50 },
        { code: 'BA17d1', name: '血糖機驗血糖', price: 50 },
        { code: 'BA17d2', name: '甘油球通便', price: 50 },
        { code: 'BA17e', name: '依指示置入藥盒', price: 50 },
        { code: 'BA18', name: '安全看視(30分鐘)', price: 200 },
        { code: 'BA20', name: '陪伴服務(30分鐘)', price: 175 },
        { code: 'BA22', name: '巡視服務(3次)', price: 130 },
        { code: 'BA23', name: '協助洗頭', price: 200 },
        { code: 'BA24', name: '協助排泄', price: 220 },
      ],
      otherItems: [
        { code: 'BD01', name: '社區式沐浴服務', price: 200, unit: '次' },
        { code: 'BD02', name: '社區式晚餐服務', price: 150, unit: '次' },
        { code: 'BD03', name: '交通接送服務 (10公里內)', price: 115, unit: '趟' },
        { code: 'GA03', name: '日間照護喘息服務(全日)', price: 1250, unit: '次' },
        { code: 'GA04', name: '日間照護喘息服務(半日)', price: 625, unit: '次' },
        { code: 'GA06', name: '夜間喘息服務', price: 2000, unit: '次' },
      ],
      copayRates: {
        general: { label: '一般戶', rate: 0.16, description: '自付 16%' },
        midLow: { label: '中低收入戶', rate: 0.05, description: '自付 5%' },
        low: { label: '低收入戶', rate: 0.0, description: '自付 0%' },
      },
    };

    const isRespiteCode = (code) => code.startsWith('GA');

    function normalizeFees(raw) {
      const rates = {};
      Object.entries(raw.dayCareRates || {}).forEach(([k, v]) => {
        rates[parseInt(k)] = v;
      });
      const limits = {};
      Object.entries(raw.monthlyLimits || {}).forEach(([k, v]) => {
        limits[parseInt(k)] = v;
      });
      const respite = {};
      Object.entries(raw.respiteLimits || {}).forEach(([k, v]) => {
        respite[parseInt(k)] = v;
      });
      return {
        version: raw.version || DEFAULT_FEES.version,
        updatedAt: raw.updatedAt || DEFAULT_FEES.updatedAt,
        dayCareRates: { ...DEFAULT_FEES.dayCareRates, ...rates },
        monthlyLimits: { ...DEFAULT_FEES.monthlyLimits, ...limits },
        respiteLimits: { ...DEFAULT_FEES.respiteLimits, ...respite },
        serviceItems: raw.serviceItems?.length ? raw.serviceItems : DEFAULT_FEES.serviceItems,
        otherItems: raw.otherItems?.length ? raw.otherItems : DEFAULT_FEES.otherItems,
        copayRates: { ...DEFAULT_FEES.copayRates, ...raw.copayRates },
      };
    }

    function mergeLimits(fileLimits, savedLimits, defaults) {
      const result = { ...defaults };
      if (fileLimits) Object.assign(result, fileLimits);
      if (savedLimits) {
        Object.entries(savedLimits).forEach(([k, v]) => {
          if (v > 0) result[k] = v;
        });
      }
      return result;
    }

    function mergeStoredFees(fileData, saved) {
      if (!fileData) return saved;
      const monthlyDefaults = {};
      const respiteDefaults = {};
      Object.entries(DEFAULT_FEES.monthlyLimits).forEach(([k, v]) => { monthlyDefaults[k] = v; });
      Object.entries(DEFAULT_FEES.respiteLimits).forEach(([k, v]) => { respiteDefaults[k] = v; });
      return {
        ...fileData,
        ...saved,
        monthlyLimits: mergeLimits(fileData.monthlyLimits, saved.monthlyLimits, monthlyDefaults),
        respiteLimits: mergeLimits(fileData.respiteLimits, saved.respiteLimits, respiteDefaults),
      };
    }

    function App() {
      const [fees, setFees] = useState(null);
      const [feeSource, setFeeSource] = useState('');
      const [userType, setUserType] = useState('general');
      const [careLevel, setCareLevel] = useState(2);
      const [careDuration, setCareDuration] = useState('full');
      const [careDays, setCareDays] = useState(0);
      const [serviceQuantities, setServiceQuantities] = useState({});
      const [expandedSections, setExpandedSections] = useState({ dayCare: true, homeCare: false, respite: false, other: false });

      const toggleSection = (key) => setExpandedSections(prev => ({ ...prev, [key]: !prev[key] }));

      useEffect(() => {
        async function loadFees() {
          let fileData = null;
          try {
            const res = await fetch('./fees-config.json');
            if (res.ok) fileData = await res.json();
          } catch (_) {}

          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              setFees(normalizeFees(mergeStoredFees(fileData, parsed)));
              setFeeSource('本機設定');
              return;
            } catch (_) {}
          }
          if (fileData) {
            setFees(normalizeFees(fileData));
            setFeeSource('fees-config.json');
            return;
          }
          setFees(normalizeFees(DEFAULT_FEES));
          setFeeSource('內建預設');
        }
        loadFees();
      }, []);

      const handleServiceChange = (code, delta) => {
        setServiceQuantities(prev => {
          const current = prev[code] || 0;
          const next = Math.max(0, current + delta);
          if (next === 0) {
            const { [code]: _, ...rest } = prev;
            return rest;
          }
          return { ...prev, [code]: next };
        });
      };

      const resetAll = () => {
        setCareDays(0);
        setServiceQuantities({});
        setCareLevel(2);
        setUserType('general');
        setExpandedSections({ dayCare: true, homeCare: false, respite: false, other: false });
      };

      const calculations = useMemo(() => {
        if (!fees) return null;
        const { dayCareRates, monthlyLimits, respiteLimits, serviceItems, otherItems, copayRates } = fees;
        const copayRate = copayRates[userType].rate;
        const monthlyLimit = monthlyLimits[careLevel];
        const respiteLimit = respiteLimits[careLevel];
        const details = [];
        let careStandardRaw = 0;
        let careFixedSelfPay = 0;
        let careRaw = 0;
        let respiteRaw = 0;
        let otherRaw = 0;

        if (careDays > 0) {
          const subtotal = dayCareRates[careLevel][careDuration] * careDays;
          careRaw += subtotal;
          careStandardRaw += subtotal;
          details.push({
            category: '日間照護',
            name: `日間照顧 (${careLevel}級/${careDuration === 'full' ? '全日' : '半日'})`,
            qty: careDays,
            unit: '天',
            subtotal,
          });
        }

        Object.entries(serviceQuantities).forEach(([code, qty]) => {
          const homeItem = serviceItems.find(i => i.code === code);
          if (homeItem) {
            const subtotal = homeItem.price * qty;
            careRaw += subtotal;
            if (homeItem.fixedCopay) {
              careFixedSelfPay += homeItem.fixedCopay[userType] * qty;
            } else {
              careStandardRaw += subtotal;
            }
            details.push({
              category: '居家照顧',
              name: homeItem.name,
              qty,
              unit: '次',
              subtotal,
            });
            return;
          }
          const otherItem = otherItems.find(i => i.code === code);
          if (otherItem) {
            const subtotal = otherItem.price * qty;
            const category = isRespiteCode(code) ? '喘息服務（G碼）' : '其他服務';
            if (isRespiteCode(code)) {
              respiteRaw += subtotal;
            } else {
              otherRaw += subtotal;
            }
            details.push({
              category,
              name: otherItem.name,
              qty,
              unit: otherItem.unit,
              subtotal,
            });
          }
        });

        const withinLimit = Math.min(careRaw, monthlyLimit);
        const careExcess = Math.max(0, careRaw - monthlyLimit);
        const isOverCareLimit = careExcess > 0;

        const respiteWithinLimit = Math.min(respiteRaw, respiteLimit);
        const respiteExcess = Math.max(0, respiteRaw - respiteLimit);
        const isOverRespiteLimit = respiteExcess > 0;

        let careCopaySelfPay = 0;
        if (careRaw > 0) {
          if (isOverCareLimit) {
            const ratio = withinLimit / careRaw;
            careCopaySelfPay = Math.floor(careStandardRaw * ratio * copayRate) + careFixedSelfPay * ratio;
          } else {
            careCopaySelfPay = Math.floor(careStandardRaw * copayRate) + careFixedSelfPay;
          }
        }

        let respiteCopaySelfPay = 0;
        if (respiteRaw > 0) {
          respiteCopaySelfPay = Math.floor(respiteWithinLimit * copayRate);
        }

        const otherCopaySelfPay = Math.floor(otherRaw * copayRate);
        const totalRaw = careRaw + respiteRaw + otherRaw;
        const totalSelfPay = careCopaySelfPay + careExcess + respiteCopaySelfPay + respiteExcess + otherCopaySelfPay;
        const totalGovPay = totalRaw - totalSelfPay;
        const careLimitUsagePercent = monthlyLimit > 0 ? Math.min(100, (careRaw / monthlyLimit) * 100) : 0;
        const respiteLimitUsagePercent = respiteLimit > 0 ? Math.min(100, (respiteRaw / respiteLimit) * 100) : 0;
        const hasHomeCareFixed = serviceItems.some(i => i.fixedCopay && (serviceQuantities[i.code] || 0) > 0);
        const activeCategories = [
          careDays > 0 && '日間照護',
          Object.keys(serviceQuantities).some(c => serviceItems.find(i => i.code === c)) && '居家照顧',
          Object.keys(serviceQuantities).some(c => otherItems.find(i => i.code === c) && isRespiteCode(c)) && '喘息服務',
          Object.keys(serviceQuantities).some(c => otherItems.find(i => i.code === c) && !isRespiteCode(c)) && '其他服務',
        ].filter(Boolean);

        return {
          raw: totalRaw,
          careRaw,
          respiteRaw,
          otherRaw,
          self: totalSelfPay,
          gov: totalGovPay,
          list: details,
          monthlyLimit,
          respiteLimit,
          withinLimit,
          careExcess,
          isOverCareLimit,
          respiteExcess,
          isOverRespiteLimit,
          careCopaySelfPay,
          respiteCopaySelfPay,
          otherCopaySelfPay,
          careLimitUsagePercent,
          respiteLimitUsagePercent,
          hasHomeCareFixed,
          activeCategories,
        };
      }, [fees, userType, careLevel, careDuration, careDays, serviceQuantities]);

      if (!fees || !calculations) {
        return (
          <div className="min-h-screen flex items-center justify-center text-slate-500">
            載入費率設定中…
          </div>
        );
      }

      const { dayCareRates, monthlyLimits, respiteLimits, serviceItems, otherItems, copayRates } = fees;
      const respiteItems = otherItems.filter(i => isRespiteCode(i.code));
      const communityItems = otherItems.filter(i => !isRespiteCode(i.code));

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-20 font-sans">
          
          <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10">
            <div className="max-w-3xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <Calculator className="w-6 h-6" />
                <h1 className="text-xl font-bold tracking-wide">長照費用試算</h1>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={resetAll}
                  className="text-xs bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-full transition flex items-center gap-1"
                >
                  <Trash2 className="w-3 h-3" /> 清除重填
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-3xl mx-auto p-4 space-y-6">

            <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
              <div className="flex items-center gap-2 mb-4 text-emerald-700 font-semibold border-b pb-2">
                <User className="w-5 h-5" />
                <h2>第一步：選擇身分別與長照等級</h2>
              </div>
              
              <div className="grid grid-cols-3 gap-3 mb-5">
                {Object.entries(copayRates).map(([key, data]) => (
                  <button
                    key={key}
                    onClick={() => setUserType(key)}
                    className={`
                      relative flex flex-col items-center justify-center p-3 rounded-lg border-2 transition-all
                      ${userType === key 
                        ? 'border-emerald-500 bg-emerald-50 text-emerald-900' 
                        : 'border-slate-100 bg-white text-slate-500 hover:border-slate-300'}
                    `}
                  >
                    <span className="font-bold text-sm md:text-base">{data.label}</span>
                    <span className="text-xs mt-1 bg-white px-2 py-0.5 rounded-full border border-slate-200">
                      {data.description}
                    </span>
                    {userType === key && (
                      <div className="absolute top-1 right-1 w-2 h-2 bg-emerald-500 rounded-full"></div>
                    )}
                  </button>
                ))}
              </div>

              <div className="space-y-3">
                <label className="block text-sm font-medium text-slate-700">長照等級</label>
                <div className="relative">
                  <select 
                    value={careLevel} 
                    onChange={(e) => setCareLevel(parseInt(e.target.value))}
                    className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white appearance-none"
                  >
                    {[2,3,4,5,6,7,8].map(lvl => (
                      <option key={lvl} value={lvl}>
                        第 {lvl} 級
                      </option>
                    ))}
                  </select>
                  <div className="absolute right-3 top-3.5 pointer-events-none text-slate-500">▼</div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg">
                    <div className="text-xs text-emerald-700 font-medium mb-1">照顧及專業服務額度（每月）</div>
                    <div className="text-lg font-bold text-emerald-800">${monthlyLimits[careLevel].toLocaleString()}</div>
                  </div>
                  <div className="p-3 bg-purple-50 border border-purple-200 rounded-lg">
                    <div className="text-xs text-purple-700 font-medium mb-1">喘息服務額度（G碼／每年）</div>
                    <div className="text-lg font-bold text-purple-800">${respiteLimits[careLevel].toLocaleString()}</div>
                  </div>
                </div>
              </div>
            </section>

            <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
              <div className="flex items-center gap-2 mb-4 text-emerald-700 font-semibold border-b pb-2">
                <ClipboardList className="w-5 h-5" />
                <h2>第二步：選擇服務項目（可同時疊加多類別）</h2>
              </div>
              <p className="text-sm text-slate-500 mb-4">各類服務可同時疊加。照顧額度（每月）與喘息額度（G碼／每年）各自獨立計算。</p>

              <div className="space-y-3">
                {/* 日間照護 */}
                <div className="border border-slate-200 rounded-xl overflow-hidden">
                  <button
                    onClick={() => toggleSection('dayCare')}
                    className="w-full flex items-center justify-between p-4 bg-orange-50 hover:bg-orange-100 transition"
                  >
                    <div className="flex items-center gap-3">
                      <Sun className="w-5 h-5 text-orange-500" />
                      <div className="text-left">
                        <div className="font-bold text-slate-800">日間照護</div>
                        <div className="text-xs text-slate-500">長照/日照中心</div>
                      </div>
                      {careDays > 0 && (
                        <span className="text-xs bg-orange-200 text-orange-800 px-2 py-0.5 rounded-full">
                          {careDays} 天 · ${(dayCareRates[careLevel][careDuration] * careDays).toLocaleString()}
                        </span>
                      )}
                    </div>
                    <span className="text-slate-400">{expandedSections.dayCare ? '▲' : '▼'}</span>
                  </button>
                  {expandedSections.dayCare && (
                    <div className="p-4 border-t border-slate-200">
                      <div className="space-y-3 mb-4">
                        <label className="block text-sm font-medium text-slate-700">服務時間</label>
                        <div className="flex bg-slate-100 p-1 rounded-lg">
                          <button
                            onClick={() => setCareDuration('half')}
                            className={`flex-1 py-2 text-sm rounded-md transition ${careDuration === 'half' ? 'bg-white shadow text-emerald-700 font-bold' : 'text-slate-500'}`}
                          >
                            半日照護
                          </button>
                          <button
                            onClick={() => setCareDuration('full')}
                            className={`flex-1 py-2 text-sm rounded-md transition ${careDuration === 'full' ? 'bg-white shadow text-emerald-700 font-bold' : 'text-slate-500'}`}
                          >
                            全日照護
                          </button>
                        </div>
                      </div>
                      <div className="p-4 bg-orange-50 rounded-lg border border-orange-100">
                        <label className="block text-sm font-medium text-slate-700 mb-3">本月使用天數</label>
                        <div className="flex flex-col gap-4">
                          <div className="flex items-center justify-between bg-white rounded-lg p-2 shadow-sm border border-orange-200">
                            <button onClick={() => setCareDays(d => Math.max(0, d - 1))} className="p-2 text-slate-400 hover:text-orange-600 hover:bg-orange-50 rounded-full transition">
                              <Minus className="w-5 h-5" />
                            </button>
                            <div className="flex items-baseline gap-1">
                              <input
                                type="number" min="0" max="31" value={careDays}
                                onChange={(e) => {
                                  const val = parseInt(e.target.value);
                                  if (!isNaN(val) && val >= 0 && val <= 31) setCareDays(val);
                                  else if (e.target.value === '') setCareDays(0);
                                }}
                                className="w-20 text-center text-2xl font-bold text-emerald-600 outline-none border-b-2 border-transparent focus:border-emerald-500 bg-transparent"
                              />
                              <span className="text-sm text-slate-500">天</span>
                            </div>
                            <button onClick={() => setCareDays(d => Math.min(31, d + 1))} className="p-2 text-slate-400 hover:text-orange-600 hover:bg-orange-50 rounded-full transition">
                              <Plus className="w-5 h-5" />
                            </button>
                          </div>
                          <input type="range" min="0" max="31" value={careDays} onChange={(e) => setCareDays(parseInt(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-orange-500" />
                        </div>
                        <div className="mt-3 flex justify-between text-sm text-slate-500 border-t border-orange-200 pt-2">
                          <span>單價: ${dayCareRates[careLevel][careDuration]}</span>
                          <span>小計: <span className="font-medium text-slate-900">${(dayCareRates[careLevel][careDuration] * careDays).toLocaleString()}</span></span>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* 居家照顧 */}
                <div className="border border-slate-200 rounded-xl overflow-hidden">
                  <button
                    onClick={() => toggleSection('homeCare')}
                    className="w-full flex items-center justify-between p-4 bg-blue-50 hover:bg-blue-100 transition"
                  >
                    <div className="flex items-center gap-3">
                      <Home className="w-5 h-5 text-blue-500" />
                      <div className="text-left">
                        <div className="font-bold text-slate-800">居家照顧</div>
                        <div className="text-xs text-slate-500">居服員到府服務</div>
                      </div>
                      {Object.keys(serviceQuantities).filter(c => serviceItems.find(i => i.code === c)).length > 0 && (
                        <span className="text-xs bg-blue-200 text-blue-800 px-2 py-0.5 rounded-full">
                          {Object.keys(serviceQuantities).filter(c => serviceItems.find(i => i.code === c)).length} 項
                        </span>
                      )}
                    </div>
                    <span className="text-slate-400">{expandedSections.homeCare ? '▲' : '▼'}</span>
                  </button>
                  {expandedSections.homeCare && (
                    <div className="p-4 border-t border-slate-200">
                      <p className="text-sm text-slate-500 mb-3">請輸入各項服務本月預計使用的次數：</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {serviceItems.map((item) => {
                          const qty = serviceQuantities[item.code] || 0;
                          return (
                            <div key={item.code} className={`flex items-center justify-between p-3 rounded-lg border transition-colors ${qty > 0 ? 'border-emerald-500 bg-emerald-50/50' : 'border-slate-100 hover:border-emerald-200'}`}>
                              <div className="flex-1 min-w-0">
                                <div className="font-medium text-slate-800 truncate">{item.name}</div>
                                <div className="text-xs text-slate-500 flex flex-wrap items-center gap-1.5 mt-0.5">
                                  <span className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-500 font-mono">{item.code}</span>
                                  {item.fixedCopay && (
                                    <span className="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded border border-blue-200">共用費率</span>
                                  )}
                                  <span>${item.price}/次</span>
                                </div>
                              </div>
                              <div className="flex items-center gap-3 bg-white border border-slate-200 rounded-lg px-2 py-1 shadow-sm flex-shrink-0 ml-2">
                                <button onClick={() => handleServiceChange(item.code, -1)} disabled={qty === 0} className="text-slate-400 hover:text-emerald-600 disabled:opacity-30 transition">
                                  <Minus className="w-4 h-4" />
                                </button>
                                <span className={`w-6 text-center font-bold ${qty > 0 ? 'text-emerald-600' : 'text-slate-300'}`}>{qty}</span>
                                <button onClick={() => handleServiceChange(item.code, 1)} className="text-slate-400 hover:text-emerald-600 transition">
                                  <Plus className="w-4 h-4" />
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                {/* 喘息服務（G碼） */}
                <div className="border border-slate-200 rounded-xl overflow-hidden">
                  <button
                    onClick={() => toggleSection('respite')}
                    className="w-full flex items-center justify-between p-4 bg-purple-50 hover:bg-purple-100 transition"
                  >
                    <div className="flex items-center gap-3">
                      <Package className="w-5 h-5 text-purple-500" />
                      <div className="text-left">
                        <div className="font-bold text-slate-800">喘息服務（G碼）</div>
                        <div className="text-xs text-slate-500">年度額度 ${respiteLimits[careLevel].toLocaleString()}</div>
                      </div>
                      {Object.keys(serviceQuantities).filter(c => respiteItems.find(i => i.code === c)).length > 0 && (
                        <span className="text-xs bg-purple-200 text-purple-800 px-2 py-0.5 rounded-full">
                          {Object.keys(serviceQuantities).filter(c => respiteItems.find(i => i.code === c)).length} 項
                        </span>
                      )}
                    </div>
                    <span className="text-slate-400">{expandedSections.respite ? '▲' : '▼'}</span>
                  </button>
                  {expandedSections.respite && (
                    <div className="p-4 border-t border-slate-200">
                      <p className="text-sm text-slate-500 mb-3">請輸入各項喘息服務預計使用次數（計入年度 G 碼額度）：</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {respiteItems.map((item) => {
                          const qty = serviceQuantities[item.code] || 0;
                          return (
                            <div key={item.code} className={`flex items-center justify-between p-3 rounded-lg border transition-colors ${qty > 0 ? 'border-purple-500 bg-purple-50/50' : 'border-slate-100 hover:border-purple-200'}`}>
                              <div className="flex-1 min-w-0">
                                <div className="font-medium text-slate-800 truncate">{item.name}</div>
                                <div className="text-xs text-slate-500 flex flex-wrap items-center gap-1.5 mt-0.5">
                                  <span className="bg-purple-100 px-1.5 py-0.5 rounded text-purple-700 font-mono">{item.code}</span>
                                  <span className="bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded border border-purple-200">G碼</span>
                                  <span>${item.price}/{item.unit}</span>
                                </div>
                              </div>
                              <div className="flex items-center gap-3 bg-white border border-slate-200 rounded-lg px-2 py-1 shadow-sm flex-shrink-0 ml-2">
                                <button onClick={() => handleServiceChange(item.code, -1)} disabled={qty === 0} className="text-slate-400 hover:text-purple-600 disabled:opacity-30 transition">
                                  <Minus className="w-4 h-4" />
                                </button>
                                <span className={`w-6 text-center font-bold ${qty > 0 ? 'text-purple-600' : 'text-slate-300'}`}>{qty}</span>
                                <button onClick={() => handleServiceChange(item.code, 1)} className="text-slate-400 hover:text-purple-600 transition">
                                  <Plus className="w-4 h-4" />
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                {/* 其他服務 */}
                <div className="border border-slate-200 rounded-xl overflow-hidden">
                  <button
                    onClick={() => toggleSection('other')}
                    className="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition"
                  >
                    <div className="flex items-center gap-3">
                      <Package className="w-5 h-5 text-slate-500" />
                      <div className="text-left">
                        <div className="font-bold text-slate-800">其他服務</div>
                        <div className="text-xs text-slate-500">交通、沐浴、社區服務</div>
                      </div>
                      {Object.keys(serviceQuantities).filter(c => communityItems.find(i => i.code === c)).length > 0 && (
                        <span className="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">
                          {Object.keys(serviceQuantities).filter(c => communityItems.find(i => i.code === c)).length} 項
                        </span>
                      )}
                    </div>
                    <span className="text-slate-400">{expandedSections.other ? '▲' : '▼'}</span>
                  </button>
                  {expandedSections.other && (
                    <div className="p-4 border-t border-slate-200">
                      <p className="text-sm text-slate-500 mb-3">請輸入各項服務本月預計使用的次數/趟數：</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {communityItems.map((item) => {
                          const qty = serviceQuantities[item.code] || 0;
                          return (
                            <div key={item.code} className={`flex items-center justify-between p-3 rounded-lg border transition-colors ${qty > 0 ? 'border-emerald-500 bg-emerald-50/50' : 'border-slate-100 hover:border-emerald-200'}`}>
                              <div className="flex-1 min-w-0">
                                <div className="font-medium text-slate-800 truncate">{item.name}</div>
                                <div className="text-xs text-slate-500 flex flex-wrap items-center gap-1.5 mt-0.5">
                                  <span className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-500 font-mono">{item.code}</span>
                                  <span>${item.price}/{item.unit}</span>
                                </div>
                              </div>
                              <div className="flex items-center gap-3 bg-white border border-slate-200 rounded-lg px-2 py-1 shadow-sm flex-shrink-0 ml-2">
                                <button onClick={() => handleServiceChange(item.code, -1)} disabled={qty === 0} className="text-slate-400 hover:text-emerald-600 disabled:opacity-30 transition">
                                  <Minus className="w-4 h-4" />
                                </button>
                                <span className={`w-6 text-center font-bold ${qty > 0 ? 'text-emerald-600' : 'text-slate-300'}`}>{qty}</span>
                                <button onClick={() => handleServiceChange(item.code, 1)} className="text-slate-400 hover:text-emerald-600 transition">
                                  <Plus className="w-4 h-4" />
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </section>

            <section className="bg-gradient-to-br from-slate-800 to-slate-900 text-white rounded-xl shadow-lg p-6 mb-8">
              <div className="flex items-center gap-2 mb-6">
                <Coins className="w-6 h-6 text-yellow-400" />
                <h2 className="text-xl font-bold">
                  費用試算總表
                  {calculations.activeCategories.length > 0 && (
                    <span className="text-sm font-normal text-slate-400 ml-2">
                      ({calculations.activeCategories.join(' + ')})
                    </span>
                  )}
                </h2>
              </div>

              <div className="mb-5 p-4 bg-slate-700/50 rounded-lg border border-slate-600 space-y-4">
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-sm text-slate-300">照顧及專業服務額度（{careLevel}級／每月）</span>
                    <span className="font-mono font-bold">${calculations.monthlyLimit.toLocaleString()}</span>
                  </div>
                  <div className="w-full bg-slate-600 rounded-full h-2.5 mb-2">
                    <div
                      className={`h-2.5 rounded-full transition-all ${calculations.isOverCareLimit ? 'bg-red-500' : 'bg-emerald-400'}`}
                      style={{ width: `${Math.min(100, calculations.careLimitUsagePercent)}%` }}
                    ></div>
                  </div>
                  <div className="flex justify-between text-xs text-slate-400">
                    <span>日間+居家 ${calculations.careRaw.toLocaleString()}</span>
                    <span>{calculations.isOverCareLimit ? '已超過額度' : `剩餘 $${(calculations.monthlyLimit - calculations.careRaw).toLocaleString()}`}</span>
                  </div>
                </div>

                {(calculations.respiteRaw > 0 || calculations.respiteLimit > 0) && (
                  <div className="pt-3 border-t border-slate-600">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm text-slate-300">喘息服務額度（G碼／每年）</span>
                      <span className="font-mono font-bold">${calculations.respiteLimit.toLocaleString()}</span>
                    </div>
                    <div className="w-full bg-slate-600 rounded-full h-2.5 mb-2">
                      <div
                        className={`h-2.5 rounded-full transition-all ${calculations.isOverRespiteLimit ? 'bg-red-500' : 'bg-purple-400'}`}
                        style={{ width: `${Math.min(100, calculations.respiteLimitUsagePercent)}%` }}
                      ></div>
                    </div>
                    <div className="flex justify-between text-xs text-slate-400">
                      <span>喘息服務 ${calculations.respiteRaw.toLocaleString()}</span>
                      <span>{calculations.isOverRespiteLimit ? '已超過額度' : calculations.respiteRaw > 0 ? `剩餘 $${(calculations.respiteLimit - calculations.respiteRaw).toLocaleString()}` : '尚未使用'}</span>
                    </div>
                  </div>
                )}

                {calculations.otherRaw > 0 && (
                  <div className="pt-3 border-t border-slate-600 text-xs text-slate-400">
                    其他服務（交通、沐浴等）${calculations.otherRaw.toLocaleString()}（另有獨立額度）
                  </div>
                )}
              </div>

              {(calculations.isOverCareLimit || calculations.isOverRespiteLimit) && (
                <div className="mb-5 p-3 bg-red-900/40 border border-red-500/50 rounded-lg text-sm space-y-2">
                  {calculations.isOverCareLimit && (
                    <div className="flex items-start gap-2">
                      <AlertCircle className="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" />
                      <div>
                        <p className="text-red-200 font-medium">超過照顧及專業服務每月額度</p>
                        <p className="text-red-300/80 text-xs mt-1">
                          超出 ${calculations.careExcess.toLocaleString()} 需全額自費；
                          額度內自付 ${calculations.careCopaySelfPay.toLocaleString()}
                        </p>
                      </div>
                    </div>
                  )}
                  {calculations.isOverRespiteLimit && (
                    <div className="flex items-start gap-2">
                      <AlertCircle className="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" />
                      <div>
                        <p className="text-red-200 font-medium">超過喘息服務（G碼）年度額度</p>
                        <p className="text-red-300/80 text-xs mt-1">
                          超出 ${calculations.respiteExcess.toLocaleString()} 需全額自費；
                          額度內自付 ${calculations.respiteCopaySelfPay.toLocaleString()}
                        </p>
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div className="space-y-4">
                {calculations.list.length > 0 ? (
                  <div className="space-y-3 text-sm text-slate-300 pb-4 border-b border-slate-700 max-h-48 overflow-y-auto">
                    {['日間照護', '居家照顧', '喘息服務（G碼）', '其他服務'].map(cat => {
                      const items = calculations.list.filter(i => i.category === cat);
                      if (items.length === 0) return null;
                      return (
                        <div key={cat}>
                          <div className="text-xs text-slate-500 font-medium mb-1">{cat}</div>
                          {items.map((item, idx) => (
                            <div key={idx} className="flex justify-between pl-2">
                              <span>{item.name} x {item.qty}{item.unit}</span>
                              <span>${item.subtotal.toLocaleString()}</span>
                            </div>
                          ))}
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="text-center text-slate-500 py-4 italic border-b border-slate-700">
                    尚未選擇任何服務或天數
                  </div>
                )}

                <div className="grid grid-cols-2 gap-8 pt-2">
                  <div>
                    <div className="text-sm text-slate-400 mb-1">總費用 (未補助)</div>
                    <div className="text-2xl font-mono text-white">${calculations.raw.toLocaleString()}</div>
                  </div>
                  <div>
                    <div className="text-sm text-emerald-400 mb-1 font-bold">民眾自付額</div>
                    <div className="text-3xl font-bold font-mono text-yellow-400">
                      ${calculations.self.toLocaleString()}
                    </div>
                  </div>
                </div>

                <div className="mt-4 pt-3 border-t border-slate-700 flex justify-between text-xs text-slate-400">
                   <span>政府補助金額: ${calculations.gov.toLocaleString()}</span>
                   <span>
                     {calculations.isOverCareLimit || calculations.isOverRespiteLimit
                       ? '*超額部分全額自費'
                       : calculations.hasHomeCareFixed ? '*共用項目依照表定特殊費率計算' : '*依照單價與部分負擔比率計算'}
                   </span>
                </div>
              </div>
            </section>

            <div className="flex items-start gap-2 text-xs text-slate-500 bg-slate-100 p-3 rounded-lg">
              <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
              <div>
                <p>
                  注意：本試算表依據單價、部分負擔比例及額度上限計算。照顧服務為每月額度，喘息服務（G碼）為每年額度，超過部分需全額自費。交通接送等另有獨立額度，實際費用請洽照管專員或撥打 1966 長照專線確認。
                </p>
                <p className="mt-1 text-slate-400">
                  費率版本 {fees.version}（{fees.updatedAt}）· 來源：{feeSource}
                </p>
              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
