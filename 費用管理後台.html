<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長照費用管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = 'ltc-fees-config';
    const CARE_LEVELS = [2, 3, 4, 5, 6, 7, 8];

    const DEFAULT_CONFIG = {
      version: '2025',
      updatedAt: '2025-01-01',
      dayCareRates: {
        '2': { half: 340, full: 675 },
        '3': { half: 420, full: 840 },
        '4': { half: 460, full: 920 },
        '5': { half: 525, full: 1045 },
        '6': { half: 565, full: 1130 },
        '7': { half: 605, full: 1210 },
        '8': { half: 645, full: 1285 },
      },
      monthlyLimits: {
        '2': 10020, '3': 15460, '4': 18580, '5': 24100,
        '6': 28070, '7': 32090, '8': 36180,
      },
      respiteLimits: {
        '2': 32340, '3': 32340, '4': 32340, '5': 32340, '6': 32340,
        '7': 48510, '8': 48510,
      },
      copayRates: {
        general: { label: '一般戶', rate: 0.16, description: '自付 16%' },
        midLow: { label: '中低收入戶', rate: 0.05, description: '自付 5%' },
        low: { label: '低收入戶', rate: 0.0, description: '自付 0%' },
      },
    };

    const isRespiteCode = (code) => String(code || '').startsWith('GA');

    const emptyConfig = () => ({
      ...DEFAULT_CONFIG,
      dayCareRates: Object.fromEntries(CARE_LEVELS.map(l => [String(l), { half: 0, full: 0 }])),
      monthlyLimits: Object.fromEntries(CARE_LEVELS.map(l => [String(l), 0])),
      respiteLimits: Object.fromEntries(CARE_LEVELS.map(l => [String(l), 0])),
      serviceItems: [],
      otherItems: [],
    });

    function normalizeConfig(raw) {
      const config = {
        version: raw.version || DEFAULT_CONFIG.version,
        updatedAt: raw.updatedAt || DEFAULT_CONFIG.updatedAt,
        dayCareRates: { ...DEFAULT_CONFIG.dayCareRates, ...(raw.dayCareRates || {}) },
        monthlyLimits: { ...DEFAULT_CONFIG.monthlyLimits, ...(raw.monthlyLimits || {}) },
        respiteLimits: { ...DEFAULT_CONFIG.respiteLimits, ...(raw.respiteLimits || {}) },
        copayRates: { ...DEFAULT_CONFIG.copayRates, ...(raw.copayRates || {}) },
        serviceItems: Array.isArray(raw.serviceItems) ? raw.serviceItems : [],
        otherItems: Array.isArray(raw.otherItems) ? raw.otherItems : [],
      };
      return config;
    }

    function mergeLimits(fileLimits, savedLimits, defaults) {
      const result = { ...defaults };
      if (fileLimits) Object.assign(result, fileLimits);
      if (savedLimits) {
        Object.entries(savedLimits).forEach(([k, v]) => {
          if (v > 0) result[k] = v;
        });
      }
      return result;
    }

    function mergeStoredConfig(fileConfig, saved) {
      if (!fileConfig) return saved;
      return {
        ...fileConfig,
        ...saved,
        monthlyLimits: mergeLimits(fileConfig.monthlyLimits, saved.monthlyLimits, DEFAULT_CONFIG.monthlyLimits),
        respiteLimits: mergeLimits(fileConfig.respiteLimits, saved.respiteLimits, DEFAULT_CONFIG.respiteLimits),
      };
    }

    function downloadJson(config) {
      const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fees-config-${config.version || 'export'}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function NumberInput({ value, onChange, className = '', min = 0, step = 1 }) {
      return (
        <input
          type="number"
          min={min}
          step={step}
          value={value}
          onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
          className={`w-full px-2 py-1.5 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none ${className}`}
        />
      );
    }

    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 3000);
        return () => clearTimeout(t);
      }, [onClose]);

      const colors = type === 'success'
        ? 'bg-emerald-600'
        : type === 'error'
          ? 'bg-red-600'
          : 'bg-blue-600';

      return (
        <div className={`fixed bottom-6 right-6 ${colors} text-white px-4 py-3 rounded-lg shadow-lg z-50 text-sm`}>
          {message}
        </div>
      );
    }

    function App() {
      const [config, setConfig] = useState(null);
      const [activeTab, setActiveTab] = useState('dayCare');
      const [toast, setToast] = useState(null);
      const fileRef = useRef(null);

      const showToast = (message, type = 'info') => setToast({ message, type });

      useEffect(() => {
        async function load() {
          let fileConfig = null;
          try {
            const res = await fetch('./fees-config.json');
            if (res.ok) fileConfig = await res.json();
          } catch (_) {}

          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              setConfig(normalizeConfig(mergeStoredConfig(fileConfig, parsed)));
              return;
            } catch (_) {}
          }
          if (fileConfig) {
            setConfig(normalizeConfig(fileConfig));
            return;
          }
          setConfig(normalizeConfig(emptyConfig()));
        }
        load();
      }, []);

      const updateConfig = (patch) => setConfig(prev => ({ ...prev, ...patch }));

      const handleExport = () => {
        const exported = { ...config, updatedAt: new Date().toISOString().slice(0, 10) };
        downloadJson(exported);
        showToast('已匯出 JSON 檔案', 'success');
      };

      const handleApply = () => {
        const applied = { ...config, updatedAt: new Date().toISOString().slice(0, 10) };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(applied));
        setConfig(applied);
        showToast('已套用至試算表（同瀏覽器有效）', 'success');
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = normalizeConfig(JSON.parse(ev.target.result));
            setConfig(imported);
            showToast('匯入成功', 'success');
          } catch {
            showToast('JSON 格式錯誤，匯入失敗', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleReset = () => {
        if (!confirm('確定要清除本機儲存的費率，重新從 fees-config.json 載入？')) return;
        localStorage.removeItem(STORAGE_KEY);
        fetch('./fees-config.json')
          .then(r => r.ok ? r.json() : emptyConfig())
          .then(data => {
            setConfig(normalizeConfig(data));
            showToast('已還原為預設設定', 'success');
          })
          .catch(() => {
            setConfig(emptyConfig());
            showToast('無法載入 fees-config.json', 'error');
          });
      };

      if (!config) {
        return (
          <div className="min-h-screen flex items-center justify-center text-slate-500">
            載入中…
          </div>
        );
      }

      const tabs = [
        { id: 'dayCare', label: '日間照護單價' },
        { id: 'limits', label: '給付額度上限' },
        { id: 'homeCare', label: '居家照顧項目' },
        { id: 'respite', label: '喘息服務（G碼）' },
        { id: 'other', label: '其他服務' },
        { id: 'copay', label: '部分負擔' },
        { id: 'meta', label: '版本資訊' },
      ];

      const respiteItems = config.otherItems
        .map((item, idx) => ({ item, idx }))
        .filter(({ item }) => isRespiteCode(item.code));
      const communityItems = config.otherItems
        .map((item, idx) => ({ item, idx }))
        .filter(({ item }) => !isRespiteCode(item.code));

      const renderOtherItemRow = (item, idx, accent = 'slate') => (
        <div key={idx} className={`grid grid-cols-1 md:grid-cols-5 gap-2 p-3 border rounded-lg items-center ${
          accent === 'purple' ? 'border-purple-200 bg-purple-50/50' : 'border-slate-200 bg-slate-50'
        }`}>
          <div className="flex items-center gap-2">
            <input
              placeholder="代碼"
              value={item.code}
              onChange={(e) => {
                const items = [...config.otherItems];
                items[idx] = { ...item, code: e.target.value };
                updateConfig({ otherItems: items });
              }}
              className={`w-full px-2 py-1.5 border rounded text-sm font-mono ${
                accent === 'purple' ? 'border-purple-300 bg-white' : 'border-slate-300'
              }`}
            />
            {isRespiteCode(item.code) && (
              <span className="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded border border-purple-200 whitespace-nowrap">G碼</span>
            )}
          </div>
          <input
            placeholder="名稱"
            value={item.name}
            onChange={(e) => {
              const items = [...config.otherItems];
              items[idx] = { ...item, name: e.target.value };
              updateConfig({ otherItems: items });
            }}
            className="md:col-span-2 px-2 py-1.5 border border-slate-300 rounded text-sm"
          />
          <NumberInput
            value={item.price}
            onChange={(v) => {
              const items = [...config.otherItems];
              items[idx] = { ...item, price: v };
              updateConfig({ otherItems: items });
            }}
          />
          <div className="flex gap-2">
            <input
              placeholder="單位"
              value={item.unit || '次'}
              onChange={(e) => {
                const items = [...config.otherItems];
                items[idx] = { ...item, unit: e.target.value };
                updateConfig({ otherItems: items });
              }}
              className="flex-1 px-2 py-1.5 border border-slate-300 rounded text-sm"
            />
            <button
              onClick={() => updateConfig({ otherItems: config.otherItems.filter((_, i) => i !== idx) })}
              className="text-red-500 hover:text-red-700 px-2"
            >
              刪
            </button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen pb-16">
          <header className="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-10">
            <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 className="text-xl font-bold">長照費用管理後台</h1>
                <p className="text-blue-200 text-xs mt-0.5">
                  版本 {config.version} · 更新 {config.updatedAt}
                </p>
              </div>
              <div className="flex flex-wrap gap-2">
                <a
                  href="給家屬費用試算表(需設置上限).html"
                  className="text-xs bg-blue-800 hover:bg-blue-900 px-3 py-2 rounded-lg transition"
                >
                  前往試算表
                </a>
                <button onClick={() => fileRef.current?.click()} className="text-xs bg-white text-blue-700 hover:bg-blue-50 px-3 py-2 rounded-lg transition font-medium">
                  匯入 JSON
                </button>
                <button onClick={handleExport} className="text-xs bg-emerald-500 hover:bg-emerald-600 px-3 py-2 rounded-lg transition font-medium">
                  匯出 JSON
                </button>
                <button onClick={handleApply} className="text-xs bg-amber-500 hover:bg-amber-600 px-3 py-2 rounded-lg transition font-medium">
                  套用至試算表
                </button>
              </div>
            </div>
            <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={handleImport} />
          </header>

          <main className="max-w-5xl mx-auto p-4">
            <div className="flex flex-wrap gap-2 mb-4">
              {tabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition ${
                    activeTab === tab.id
                      ? 'bg-blue-600 text-white shadow'
                      : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {activeTab === 'dayCare' && (
              <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 className="font-bold text-slate-800 mb-4">日間照護單價（依長照等級）</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="border-b border-slate-200 text-slate-500">
                        <th className="text-left py-2 pr-4">等級</th>
                        <th className="text-left py-2 px-2">半日</th>
                        <th className="text-left py-2 px-2">全日</th>
                      </tr>
                    </thead>
                    <tbody>
                      {CARE_LEVELS.map(lvl => (
                        <tr key={lvl} className="border-b border-slate-100">
                          <td className="py-2 pr-4 font-medium">第 {lvl} 級</td>
                          <td className="py-2 px-2">
                            <NumberInput
                              value={config.dayCareRates[String(lvl)]?.half ?? 0}
                              onChange={(v) => updateConfig({
                                dayCareRates: {
                                  ...config.dayCareRates,
                                  [String(lvl)]: { ...config.dayCareRates[String(lvl)], half: v },
                                },
                              })}
                            />
                          </td>
                          <td className="py-2 px-2">
                            <NumberInput
                              value={config.dayCareRates[String(lvl)]?.full ?? 0}
                              onChange={(v) => updateConfig({
                                dayCareRates: {
                                  ...config.dayCareRates,
                                  [String(lvl)]: { ...config.dayCareRates[String(lvl)], full: v },
                                },
                              })}
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            )}

            {activeTab === 'limits' && (
              <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-6">
                <div>
                  <h2 className="font-bold text-slate-800 mb-1">照顧及專業服務額度（每月）</h2>
                  <p className="text-xs text-slate-500 mb-4">適用日間照護、居家照顧、其他服務（B、C 碼及交通、沐浴等）</p>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {CARE_LEVELS.map(lvl => (
                      <div key={lvl}>
                        <label className="block text-sm text-slate-600 mb-1">第 {lvl} 級</label>
                        <NumberInput
                          value={config.monthlyLimits[String(lvl)] ?? 0}
                          onChange={(v) => updateConfig({
                            monthlyLimits: { ...config.monthlyLimits, [String(lvl)]: v },
                          })}
                        />
                      </div>
                    ))}
                  </div>
                </div>
                <div className="pt-4 border-t border-slate-200">
                  <h2 className="font-bold text-slate-800 mb-1">喘息服務額度（G碼／每年）</h2>
                  <p className="text-xs text-slate-500 mb-4">2～6 級通常為 32,340 元；7～8 級通常為 48,510 元</p>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {CARE_LEVELS.map(lvl => (
                      <div key={lvl}>
                        <label className="block text-sm text-slate-600 mb-1">第 {lvl} 級</label>
                        <NumberInput
                          value={config.respiteLimits[String(lvl)] ?? 0}
                          onChange={(v) => updateConfig({
                            respiteLimits: { ...config.respiteLimits, [String(lvl)]: v },
                          })}
                        />
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}

            {activeTab === 'homeCare' && (
              <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="font-bold text-slate-800">居家照顧服務項目</h2>
                  <button
                    onClick={() => updateConfig({
                      serviceItems: [...config.serviceItems, { code: '', name: '', price: 0 }],
                    })}
                    className="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700"
                  >
                    + 新增項目
                  </button>
                </div>
                <div className="space-y-3">
                  {config.serviceItems.map((item, idx) => (
                    <div key={idx} className="p-3 border border-slate-200 rounded-lg bg-slate-50">
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-2 mb-2">
                        <input
                          placeholder="代碼 (BA01)"
                          value={item.code}
                          onChange={(e) => {
                            const items = [...config.serviceItems];
                            items[idx] = { ...item, code: e.target.value };
                            updateConfig({ serviceItems: items });
                          }}
                          className="px-2 py-1.5 border border-slate-300 rounded text-sm font-mono"
                        />
                        <input
                          placeholder="名稱"
                          value={item.name}
                          onChange={(e) => {
                            const items = [...config.serviceItems];
                            items[idx] = { ...item, name: e.target.value };
                            updateConfig({ serviceItems: items });
                          }}
                          className="md:col-span-2 px-2 py-1.5 border border-slate-300 rounded text-sm"
                        />
                        <NumberInput
                          value={item.price}
                          onChange={(v) => {
                            const items = [...config.serviceItems];
                            items[idx] = { ...item, price: v };
                            updateConfig({ serviceItems: items });
                          }}
                        />
                      </div>
                      <div className="flex flex-wrap items-center gap-3 text-xs">
                        <label className="flex items-center gap-1.5 text-slate-600">
                          <input
                            type="checkbox"
                            checked={!!item.fixedCopay}
                            onChange={(e) => {
                              const items = [...config.serviceItems];
                              items[idx] = e.target.checked
                                ? { ...item, fixedCopay: { general: 0, midLow: 0, low: 0 } }
                                : (() => { const { fixedCopay, ...rest } = item; return rest; })();
                              updateConfig({ serviceItems: items });
                            }}
                          />
                          共用費率（固定自付額）
                        </label>
                        {item.fixedCopay && (
                          <>
                            <span className="text-slate-400">一般戶</span>
                            <NumberInput
                              className="!w-20"
                              value={item.fixedCopay.general}
                              onChange={(v) => {
                                const items = [...config.serviceItems];
                                items[idx] = { ...item, fixedCopay: { ...item.fixedCopay, general: v } };
                                updateConfig({ serviceItems: items });
                              }}
                            />
                            <span className="text-slate-400">中低收</span>
                            <NumberInput
                              className="!w-20"
                              value={item.fixedCopay.midLow}
                              onChange={(v) => {
                                const items = [...config.serviceItems];
                                items[idx] = { ...item, fixedCopay: { ...item.fixedCopay, midLow: v } };
                                updateConfig({ serviceItems: items });
                              }}
                            />
                            <span className="text-slate-400">低收</span>
                            <NumberInput
                              className="!w-20"
                              value={item.fixedCopay.low}
                              onChange={(v) => {
                                const items = [...config.serviceItems];
                                items[idx] = { ...item, fixedCopay: { ...item.fixedCopay, low: v } };
                                updateConfig({ serviceItems: items });
                              }}
                            />
                          </>
                        )}
                        <button
                          onClick={() => updateConfig({ serviceItems: config.serviceItems.filter((_, i) => i !== idx) })}
                          className="ml-auto text-red-500 hover:text-red-700"
                        >
                          刪除
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {activeTab === 'respite' && (
              <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div className="flex justify-between items-center mb-4">
                  <div>
                    <h2 className="font-bold text-slate-800">喘息服務項目（G碼）</h2>
                    <p className="text-xs text-slate-500 mt-1">代碼以 GA 開頭，計入年度喘息額度</p>
                  </div>
                  <button
                    onClick={() => updateConfig({
                      otherItems: [...config.otherItems, { code: 'GA', name: '', price: 0, unit: '次' }],
                    })}
                    className="text-xs bg-purple-600 text-white px-3 py-1.5 rounded-lg hover:bg-purple-700"
                  >
                    + 新增 G 碼項目
                  </button>
                </div>
                <div className="space-y-3">
                  {respiteItems.length > 0 ? (
                    respiteItems.map(({ item, idx }) => renderOtherItemRow(item, idx, 'purple'))
                  ) : (
                    <p className="text-sm text-slate-400 text-center py-6">尚無喘息服務項目</p>
                  )}
                </div>
              </section>
            )}

            {activeTab === 'other' && (
              <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div className="flex justify-between items-center mb-4">
                  <div>
                    <h2 className="font-bold text-slate-800">其他服務項目</h2>
                    <p className="text-xs text-slate-500 mt-1">交通、沐浴、社區服務等（計入每月照顧額度）</p>
                  </div>
                  <button
                    onClick={() => updateConfig({
                      otherItems: [...config.otherItems, { code: '', name: '', price: 0, unit: '次' }],
                    })}
                    className="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700"
                  >
                    + 新增項目
                  </button>
                </div>
                <div className="space-y-3">
                  {communityItems.length > 0 ? (
                    communityItems.map(({ item, idx }) => renderOtherItemRow(item, idx))
                  ) : (
                    <p className="text-sm text-slate-400 text-center py-6">尚無其他服務項目</p>
                  )}
                </div>
              </section>
            )}

            {activeTab === 'copay' && (
              <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 className="font-bold text-slate-800 mb-4">部分負擔比例</h2>
                <div className="space-y-4">
                  {Object.entries(config.copayRates).map(([key, data]) => (
                    <div key={key} className="p-4 border border-slate-200 rounded-lg">
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                          <label className="block text-xs text-slate-500 mb-1">身分別名稱</label>
                          <input
                            value={data.label}
                            onChange={(e) => updateConfig({
                              copayRates: {
                                ...config.copayRates,
                                [key]: { ...data, label: e.target.value },
                              },
                            })}
                            className="w-full px-2 py-1.5 border border-slate-300 rounded text-sm"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-500 mb-1">自付比例（0.16 = 16%）</label>
                          <NumberInput
                            value={data.rate}
                            step={0.01}
                            max={1}
                            onChange={(v) => updateConfig({
                              copayRates: {
                                ...config.copayRates,
                                [key]: { ...data, rate: v, description: `自付 ${Math.round(v * 100)}%` },
                              },
                            })}
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-500 mb-1">顯示說明</label>
                          <input
                            value={data.description}
                            onChange={(e) => updateConfig({
                              copayRates: {
                                ...config.copayRates,
                                [key]: { ...data, description: e.target.value },
                              },
                            })}
                            className="w-full px-2 py-1.5 border border-slate-300 rounded text-sm"
                          />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {activeTab === 'meta' && (
              <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                <h2 className="font-bold text-slate-800">版本資訊</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm text-slate-600 mb-1">費率年度版本</label>
                    <input
                      value={config.version}
                      onChange={(e) => updateConfig({ version: e.target.value })}
                      placeholder="2026"
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-sm text-slate-600 mb-1">更新日期</label>
                    <input
                      type="date"
                      value={config.updatedAt}
                      onChange={(e) => updateConfig({ updatedAt: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                    />
                  </div>
                </div>

                <div className="p-4 bg-amber-50 border border-amber-200 rounded-lg text-sm text-amber-900">
                  <p className="font-medium mb-2">每年更新流程</p>
                  <ol className="list-decimal list-inside space-y-1 text-amber-800">
                    <li>在此後台修改各項費率</li>
                    <li>點「匯出 JSON」下載新版設定檔</li>
                    <li>將檔案重新命名為 <code className="bg-amber-100 px-1 rounded">fees-config.json</code> 並替換舊檔</li>
                    <li>或點「套用至試算表」讓同瀏覽器立即生效</li>
                  </ol>
                </div>

                <button
                  onClick={handleReset}
                  className="text-sm text-red-600 hover:text-red-800 border border-red-200 hover:border-red-300 px-4 py-2 rounded-lg transition"
                >
                  清除本機設定，還原為 fees-config.json
                </button>
              </section>
            )}
          </main>

          {toast && <Toast {...toast} onClose={() => setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
